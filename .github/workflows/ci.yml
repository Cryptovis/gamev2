name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check

  bundle-size:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_SHA: 54ea1b6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build and measure (head and baseline)
        run: |
          measure() { # $1 dir, $2 label: gzip sizes of dist JS and CSS, as workflow notices
            js=0; css=0
            for f in $(find "$1/dist" -name '*.js'); do js=$((js + $(gzip -9 -c "$f" | wc -c))); done
            for f in $(find "$1/dist" -name '*.css'); do css=$((css + $(gzip -9 -c "$f" | wc -c))); done
            echo "::notice title=bundle-$2::js_gzip=$js css_gzip=$css total_gzip=$((js + css))"
            echo "$((js + css))" > "/tmp/size-$2"
          }
          npm ci && npm run build && measure . head
          git worktree add ../baseline "$BASELINE_SHA"
          (cd ../baseline && npm ci && npm run build) && measure ../baseline base
          echo "::notice title=bundle-delta::delta_gzip_bytes=$(( $(cat /tmp/size-head) - $(cat /tmp/size-base) ))"

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk
          fc-cache -f

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser playtest (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: Browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ strategy.job-index }}
          path: test-results/

  cross-engine:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Cross-engine determinism (${{ matrix.browser }})
        run: PLAYWRIGHT_DEV_SERVER=1 npx playwright test e2e/crossEngineDeterminism.spec.ts --browser=${{ matrix.browser }}

      - name: Browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-engine-results-${{ matrix.browser }}
          path: test-results/
